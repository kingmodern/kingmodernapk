<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande Véhicule</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}
.container{
    max-width:500px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px #ccc;
}
input,select{
    width:100%;
    padding:10px;
    margin:8px 0;
}
button{
    width:100%;
    padding:12px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
button:hover{
    background:#004999;
}
</style>
</head>

<body>

<div class="container">

<h2>Commande Véhicule</h2>

<input type="text" placeholder="Nom de l'acheteur">
<input type="text" placeholder="Prénom de l'acheteur">

<input type="text" placeholder="Nom du vendeur">
<input type="text" placeholder="Prénom du vendeur">

<input type="text" placeholder="Numéro de commande">

<input type="text" placeholder="Couleur">

<input type="text" placeholder="Région">

<input type="number" placeholder="Montant">

<input type="date">

<input type="time">

<label>Photo du véhicule</label>
<input type="file">

<button>Enregistrer la commande</button>

</div>

</body>
</html>
